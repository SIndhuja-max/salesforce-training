<template>

    <lightning-card title="Placement Portal" icon-name="standard:people">

        <div class="slds-p-around_medium">

            <h1 class="slds-text-heading_large slds-m-bottom_medium">
                Welcome to Vishnu Placement Portal
            </h1>

            <p><b>Student Name :</b> {studentName}</p>
            <p><b>Roll Number :</b> {rollNumber}</p>
            <p><b>Department :</b> {department}</p>

            <br/>

            <p>
                <b>Status :</b> {status}
            </p>

            <br/>

            <lightning-button
                label="Show Welcome Message"
                variant="brand"
                onclick={showMessage}>
            </lightning-button>

            <lightning-button
                label="Apply"
                variant="success"
                onclick={applyJob}
                class="slds-m-left_small">
            </lightning-button>

            <template if:true={message}>
                <div class="slds-m-top_medium">
                    <p class="slds-text-heading_medium">
                        {message}
                    </p>
                </div>
            </template>

        </div>
        <p><b>Today's Date :</b> {today}</p>

<p><b>Companies :</b> {companies}</p>

<p><b>Jobs :</b> {jobs}</p>

<p><b>Applications Submitted :</b> {applications}</p>

<br/>

    </lightning-card>

</template>
